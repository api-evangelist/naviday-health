description: Naviday Health is a Boston-based women's health technology company and Techstars portfolio
  company building clinical decision support that connects the continuous health data women generate every
  day from consumer wearables and patient-generated sources to the practitioners who need it most. Its LUCI
  Care platform surfaces actionable insights for clinicians between appointments, and the company partners
  with device manufacturers on wearable integration services. Naviday Health is HIPAA compliant and has been
  recognized by the Mayo Clinic Platform, StartUp Health, and MassChallenge. As of this enrichment pass the
  company publishes no public developer API, documentation, SDK, or well-known discovery surface.
